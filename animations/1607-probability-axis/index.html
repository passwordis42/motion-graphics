<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在坐标轴上标注更新后的概率 · 修改合集</title>
  <link rel="stylesheet" href="../shared/player.css?v=7">
</head>
<body>
  <main id="player"></main>
  <script src="../shared/player.js?v=7"></script>
  <script>
    const width = 1280;
    const height = 720;
    const origin = { x: 640, y: 359 };
    const oldTip = { x: 806, y: 437 };
    const targetAngle = Math.atan2(503 - origin.y, 884 - origin.x);
    const finalAngle = Math.atan2(oldTip.y - origin.y, oldTip.x - origin.x);
    const startAngle = -54 * Math.PI / 180;
    const radius = Math.hypot(oldTip.x - origin.x, oldTip.y - origin.y);
    const chances = [
      { x: 995, y: 319, from: 23.8, to: 18.9, tint: '#e9a6e9' },
      { x: 953, y: 194, from: 13.9, to: 17.1, tint: '#bfdcfa' },
      { x: 364, y: 248, from: 19.9, to: 16.8, tint: '#ede3a9' },
      { x: 650, y: 605, from: 26.4, to: 22.0, tint: '#c3b8ff' },
    ];
    const chinese = '"Microsoft YaHei", "PingFang SC", sans-serif';
    const numeric = 'Consolas, "Courier New", monospace';

    const interpolate = (a, b, t) => a + (b - a) * t;
    function ease(t, start, end) {
      const amount = Math.min(1, Math.max(0, (t - start) / (end - start)));
      return amount * amount * (3 - 2 * amount);
    }

    function loadImage(url) {
      const image = new Image();
      image.src = url;
      return image.decode().then(() => image);
    }

    function writeText(ctx, text, x, y, { font, fill, align = 'left', shadow = 4 }) {
      ctx.save();
      ctx.font = font;
      ctx.fillStyle = fill;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';
      ctx.shadowBlur = shadow;
      ctx.shadowColor = '#030312';
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function writeProbability(ctx, x, y, from, to, progress, color, focus = false) {
      const number = interpolate(from, to, progress).toFixed(1) + '%';
      writeText(ctx, number, x, y, {
        font: (focus ? '700 28px ' : '600 24px ') + numeric,
        fill: color,
      });
    }

    function drawOldVector(ctx, head, angle) {
      ctx.save();
      ctx.translate(origin.x, origin.y);
      ctx.rotate(angle);

      const shade = ctx.createLinearGradient(0, -4.2, 0, 4.2);
      shade.addColorStop(0, '#82b65f');
      shade.addColorStop(0.32, '#c1e9a4');
      shade.addColorStop(0.6, '#b4de94');
      shade.addColorStop(1, '#65944e');
      ctx.fillStyle = shade;
      ctx.shadowColor = 'rgba(180,240,147,.48)';
      ctx.shadowBlur = 9;
      ctx.beginPath();
      ctx.moveTo(8, -3.2);
      ctx.lineTo(radius - 17, -4.2);
      ctx.lineTo(radius - 17, 4.2);
      ctx.lineTo(8, 3.2);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;

      // The arrowhead is the original shaded artwork, rotated with the shaft.
      ctx.rotate(-finalAngle);
      ctx.drawImage(head, 772 - origin.x, 412 - origin.y);
      ctx.restore();
    }

    function draw(frame, head, ctx, time) {
      const progress = ease(time, 0.19, 1.61);
      const angle = interpolate(startAngle, finalAngle, progress);
      const x = origin.x + Math.cos(angle) * radius;
      const y = origin.y + Math.sin(angle) * radius;

      ctx.save();
      ctx.scale(ctx.canvas.width / width, ctx.canvas.height / height);
      ctx.drawImage(frame, 0, 0);

      ctx.save();
      ctx.strokeStyle = 'rgba(207,239,170,.52)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(origin.x, origin.y, 60, angle, targetAngle);
      ctx.stroke();
      ctx.restore();
      drawOldVector(ctx, head, angle);

      chances.forEach(({ x, y, from, to, tint }) =>
        writeProbability(ctx, x, y, from, to, progress, tint));
      const clearance = 1 - ease(y, 232, 267);
      const labelX = x + 19 - 26 * clearance;
      const labelY = y - 10 - 9 * clearance;
      writeText(ctx, '老', labelX, labelY, {
        font: '600 30px ' + chinese,
        fill: '#daf6bc',
      });
      writeProbability(ctx, labelX + 36, labelY + 1, 16, 25.2, progress, '#e4ffba', true);

      // Keep the source's measured angle for the settled vectors only.
      const angleOpacity = ease(time, 1.55, 1.76);
      if (angleOpacity > 0) {
        ctx.save();
        ctx.globalAlpha = angleOpacity;
        writeText(ctx, '3.07°', 690, 369, { font: '600 23px ' + numeric, fill: '#dcecc9' });
        ctx.restore();
      }

      const finished = time >= 1.71;
      const caption = finished
        ? '“老”最接近计算结果，预测概率由 16.0% 升至 25.2%'
        : '调整参数后，“老”的词向量逐渐靠近计算结果';
      writeText(ctx, caption, 640, 674, {
        font: '700 29px ' + chinese, fill: '#fff', align: 'center', shadow: 6,
      });
      ctx.restore();
    }

    Promise.all([loadImage('./axis-source.webp'), loadImage('./axis-arrowhead.png')])
      .then(([frame, head]) => {
        mountRevisionClip({
          title: '在坐标轴上标注更新后的概率',
          description: '原片坐标和其他向量保持固定，“老”的向量转向计算结果，预测概率由 16.0% 升至 25.2%。',
          marker: '16:07',
          range: '16:05.5–16:07.8',
          duration: 2.3,
          previewTime: 2.14,
          draw(ctx, t) { draw(frame, head, ctx, t); },
        });
      })
      .catch(() => {
        document.querySelector('#player').textContent = '暂时无法加载修改后的画面。';
      });
  </script>
</body>
</html>
