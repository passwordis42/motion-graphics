<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在坐标轴上标注更新后的概率 · 修改合集</title>
  <link rel="stylesheet" href="../shared/player.css?v=4">
</head>
<body>
  <main id="player"></main>
  <script src="../shared/player.js?v=4"></script>
  <script src="../shared/nnlm.js"></script>
  <script>
    const origin = { x: 958, y: 539 };
    const target = { x: 1300, y: 717 };
    const targetAngle = Math.atan2(target.y - origin.y, target.x - origin.x);
    const initialAngle = -54 * Math.PI / 180;
    const finalGap = 3.07 * Math.PI / 180;
    const rayLength = 254;
    const vectors = [
      { x: 1397, y: 494, lx: 1504, ly: 468, vx: 1607, hue: '#cf77d3' },
      { x: 1328, y: 310, lx: 1437, ly: 282, vx: 1538, hue: '#78b5f1' },
      { x: 469, y: 401, lx: 458, ly: 365, vx: 352, hue: '#e9d890' },
      { hue: '#c3f89b' },
      { x: 887, y: 870, lx: 925, ly: 868, vx: 1026, hue: '#a6a4f7' },
    ];

    function probabilityAxisState(time) {
      const progress = nnlm.easing(time, 0.22, 1.72);
      const angle = initialAngle + (targetAngle - finalGap - initialAngle) * progress;
      return {
        progress, angle,
        probabilities: nnlm.words.map(({ probability, trained }) => (probability + (trained - probability) * progress).toFixed(1)),
      };
    }

    mountRevisionClip({
      title: '在坐标轴上标注更新后的概率',
      description: '保留原坐标轴，展示“老”的词向量从较远的位置转向计算结果，最终夹角为 3.07 度。五个候选词的预测概率一起变化，“老”从 16.0% 升到 25.2%。',
      marker: '16:07',
      range: '16:05.5–16:07.8',
      duration: 2.3,
      previewTime: 1.95,
      draw(ctx, t) {
        const { words, line, box, pill, label, background, subtitle, arrow } = nnlm;
        const { progress, angle, probabilities } = probabilityAxisState(t);
        const oldX = origin.x + rayLength * Math.cos(angle);
        const oldY = origin.y + rayLength * Math.sin(angle);
        const positions = vectors.map((vector, index) => index === 3
          ? { ...vector, x: oldX, y: oldY, lx: oldX + 49, ly: oldY - 22, vx: oldX + 169 }
          : vector);
        background(ctx, true);

        line(ctx, origin.x, 73, origin.x, 936, 'rgba(94, 190, 150, .38)', 2);
        arrow(ctx, 144, 487, 1800, 610, 'rgba(88, 112, 179, .46)', 2.4, 26);
        arrow(ctx, 1264, 420, 544, 734, 'rgba(174, 101, 114, .64)', 2.25, 23);

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(origin.x, origin.y);
        ctx.arc(origin.x, origin.y, 155, angle, targetAngle);
        ctx.closePath();
        ctx.fillStyle = 'rgba(181, 231, 147, .13)';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(origin.x, origin.y, 155, angle, targetAngle);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#dff6be';
        ctx.stroke();
        if (progress > 0) {
          ctx.globalAlpha = progress * .48;
          ctx.setLineDash([9, 10]);
          line(ctx, origin.x, origin.y, origin.x + rayLength * Math.cos(initialAngle),
            origin.y + rayLength * Math.sin(initialAngle), '#c3f89b', 2.3);
        }
        ctx.restore();

        positions.forEach(({ x, y, hue }, index) => {
          ctx.save();
          ctx.shadowBlur = index === 3 ? 24 : 9;
          ctx.shadowColor = hue;
          arrow(ctx, origin.x, origin.y, x, y, hue, index === 3 ? 8 : 5.5, 29);
          ctx.restore();
        });

        arrow(ctx, origin.x, origin.y, target.x, target.y, '#e1ed9e', 5, 28);
        label(ctx, '计算结果', 1340, 733, { size: 37, color: '#e0efac', align: 'left' });
        if (progress >= 1) label(ctx, '3.07°', 1100, 555, { size: 33, color: '#d8e9cb', numeric: true, weight: 700 });

        ctx.beginPath();
        ctx.arc(origin.x, origin.y, 11, 0, 2 * Math.PI);
        ctx.fillStyle = '#d7dfc7';
        ctx.fill();

        positions.forEach(({ lx, ly, vx, hue }, index) => {
          const word = words[index];
          const correct = word.name === '老';

          if (correct) {
            box(ctx, lx - 31, ly - 37, 237, 74, 18, 'rgba(75, 119, 77, .3)', 'rgba(188, 236, 148, .75)');
          }

          label(ctx, word.name, lx, ly, { size: 38, color: hue, weight: correct ? 700 : 500 });
          pill(ctx, `${probabilities[index]}%`, vx, ly, 143, 51, {
            size: 32, color: hue, weight: 700, numeric: true,
          });
        });

        subtitle(ctx, progress < 1 ? '调整参数后，「老」的词向量逐渐靠近计算结果' : '更新后，「老」的出现概率升到 25.2%');
      },
    });
  </script>
</body>
</html>
